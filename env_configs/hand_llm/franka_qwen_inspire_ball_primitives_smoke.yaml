# Inspire-hand LLM smoke test with constrained wrist+hand primitives on a fixed ball shape.

env:
  _target_: capx.envs.tasks.franka.franka_lift.FrankaLiftCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_shape_lift_low_level
    low_level_kwargs:
      robot_name: PandaDexRH
      hand_name: inspire_right
      ik_robot_name: panda_description
      ik_target_link_name: panda_hand
      eef_body_name: gripper0_right_eef
      tcp_offset: [0.0, 0.0, -0.107]
      fixed_shape: ball
    privileged: true
    apis:
      - FrankaControlPrivilegedApi
    prompt: |
      You are controlling a Franka arm with a dexterous Inspire-style right hand.
      Goal: pick up the red object and lift it into the air.

      Important:
      - Use the dexterous-hand primitives instead of inventing raw hand joint values.
      - First call list_hand_primitives() to see the allowed primitive names.
      - For this ball task, prefer this exact sequence first:
        1. shape_info = get_object_shape()
        2. print(list_hand_primitives())
        3. primitive_name = "ball_wrap_back_down"
        4. grasp_pos, grasp_quat = sample_hand_primitive_pose(primitive_name, "object")
        5. goto_pose(grasp_pos, grasp_quat, z_approach=0.1)
        6. goto_pose(grasp_pos, grasp_quat)
        7. execute_hand_primitive(primitive_name)
        8. goto_pose(lift_pos, grasp_quat)
      - Do not invent a different strategy on the first attempt.
      - Keep the hand closed after grasping. Do not reopen it.

      Keep the program short.
      Use the shape info only for reasoning.
      ONLY write executable Python code. Do not use code fences.

      Example:
      import numpy as np
      print(list_hand_primitives())
      shape_info = get_object_shape()
      primitive_name = "ball_wrap_back_down"
      grasp_pos, grasp_quat = sample_hand_primitive_pose(primitive_name, "object")
      goto_pose(grasp_pos, grasp_quat, z_approach=0.1)
      goto_pose(grasp_pos, grasp_quat)
      execute_hand_primitive(primitive_name)
      lift_pos = grasp_pos.copy()
      lift_pos[2] += 0.1
      goto_pose(lift_pos, grasp_quat)

    multi_turn_prompt: |
      The following code blocks were just executed:
      ```python
      {executed_code}
      ```
      The current console stdout is:
      ```
      {console_stdout}
      ```
      The current console stderr is:
      ```
      {console_stderr}
      ```
      If there were errors, regenerate with corrected code.
      If the task is not complete, do not say FINISH.
      If grasping failed, keep the same program structure, but try exactly one of:
      - replace "ball_wrap_back_down" with "ball_power_down_forward"
      - replace "ball_wrap_back_down" with "ball_pinch_left_down"
      Please respond with EXACTLY ONE of the following:
      - The word 'REGENERATE' followed immediately by new Python code in a fenced code block (```python...```) if you want to modify the code.
      - The word 'FINISH' if the task appears to be complete

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
output_dir: ./outputs/qwen_inspire_ball_primitives_smoke
use_legacy_multi_turn_decision_prompt: true

trials: 1
num_workers: 1
