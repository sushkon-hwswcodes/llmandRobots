# Cube lifting with Qwen2.5-Coder-7B via Ollama (privileged state, no perception stack)
# Usage: python -m capx.envs.launch --config-path env_configs/cube_lifting_qwen/franka_qwen_privileged.yaml

env:
  _target_: capx.envs.tasks.franka.franka_lift.FrankaLiftCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_cube_lift_low_level
    privileged: true
    apis:
      - FrankaControlPrivilegedApi

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
output_dir: ./outputs/qwen_cube_lifting_privileged

trials: 20
num_workers: 1
