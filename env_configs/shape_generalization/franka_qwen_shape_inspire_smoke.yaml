# Smoke config for testing a five-finger hand path while preserving the Panda baseline configs.

env:
  _target_: capx.envs.tasks.franka.franka_lift.FrankaLiftCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_shape_lift_low_level
    low_level_kwargs:
      robot_name: PandaDexRH
      hand_name: inspire_right
      robosuite_gripper_type: default
      ik_robot_name: panda_description
      ik_target_link_name: panda_hand
      eef_body_name: gripper0_right_eef
      tcp_offset: [0.0, 0.0, -0.107]
    privileged: true
    apis:
      - FrankaControlPrivilegedApi
    prompt: |
      You are controlling a Franka Emika robot with the API described below.
      Goal: pick up the object on the table and lift it into the air.
      The robot is using a five-finger Inspire hand.
      For this Inspire-hand config, do NOT use open_gripper() or close_gripper().
      Those are legacy Panda helpers and are not the hand-control path for this task.
      Use only these Inspire-hand controls:
        - get_hand_capabilities()
        - set_hand_preshape("open" | "pregrasp" | "grasp_soft" | "close")
        - set_hand_joints([...])  # 6 values for the Inspire hand
      Do not use a single fast descend-and-close motion. Use a staged approach and a test lift.
      Do not release the object after grasping.

      Use this strategy:
        1. hand_info = get_hand_capabilities()
        2. shape_info = get_object_shape()
        3. grasp_pos, grasp_quat = sample_grasp_pose("object")

      Choose preshapes by object shape:
        - ball: use "pregrasp" before approach, then "close" at the object
        - cylinder: use "pregrasp" before approach, then "grasp_soft" first
        - box: use "open" before approach, then "grasp_soft" first
        - if unsure: use "pregrasp" before approach, then "grasp_soft"

      Use a two-stage motion:
        1. move to grasp_pos with z_approach=0.12
        2. move to grasp_pos with z_approach=0.04
        3. move to grasp_pos exactly

      Use a two-stage grasp:
        1. close to "grasp_soft" at the grasp pose unless the object is a ball
        2. do a short test lift of only 0.03 to 0.05 m
        3. return once to the grasp pose and reinforce with "close"
        4. then do the full 0.10 m lift

      Keep the code simple and deterministic:
        - define helper variables like pregrasp_name and close_name from shape_info
        - use numpy arrays for lift offsets
        - include at most one reinforcement grasp
        - do not call any functions other than the provided robot APIs and standard Python / numpy
        - do not invent helper checks such as stability or contact tests
        - do not redefine or shadow provided robot API functions such as get_object_shape, sample_grasp_pose, goto_pose, get_hand_capabilities, open_gripper, close_gripper, set_hand_preshape, or set_hand_joints
        - never call open_gripper() or close_gripper() in this config

      Example structure:
        hand_info = get_hand_capabilities()
        shape_info = get_object_shape()
        grasp_pos, grasp_quat = sample_grasp_pose("object")

        shape_name = shape_info.get("shape", "")
        if shape_name == "box":
            pregrasp_name = "open"
            close_name = "grasp_soft"
        elif shape_name == "ball":
            pregrasp_name = "pregrasp"
            close_name = "close"
        else:
            pregrasp_name = "pregrasp"
            close_name = "grasp_soft"

        set_hand_preshape(pregrasp_name)
        goto_pose(grasp_pos, grasp_quat, z_approach=0.12)
        goto_pose(grasp_pos, grasp_quat, z_approach=0.04)
        goto_pose(grasp_pos, grasp_quat)
        set_hand_preshape(close_name)
        test_lift_pos = grasp_pos + np.array([0.0, 0.0, 0.04])
        goto_pose(test_lift_pos, grasp_quat)
        goto_pose(grasp_pos, grasp_quat)
        set_hand_preshape("close")
        lift_pos = grasp_pos + np.array([0.0, 0.0, 0.10])
        goto_pose(lift_pos, grasp_quat)

      ONLY write executable Python code. Do not use code fences.
      Import numpy explicitly if needed.

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
output_dir: ./outputs/qwen_shape_inspire_smoke
use_legacy_multi_turn_decision_prompt: true

trials: 3
num_workers: 1
